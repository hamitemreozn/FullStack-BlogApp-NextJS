name: astrology-blog-app

services:
  postgres:
    image: postgres:17-alpine
    container_name: astrology-blog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - astrology-blog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: astrology-blog-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Recent MinIO releases configure CORS at the server level. This permits
      # only this local Next.js origin to submit the short-lived signed forms.
      MINIO_API_CORS_ALLOW_ORIGIN: ${BETTER_AUTH_URL}
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - astrology-blog-minio-data:/data

volumes:
  astrology-blog-postgres-data:
  astrology-blog-minio-data:
